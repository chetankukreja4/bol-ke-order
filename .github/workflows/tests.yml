# Runs on every push and pull request: the tests, then the Docker image is built,
# started with no keys, and its health check must answer.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        env:
          BKO_NO_DOTENV: "1"
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bol-ke-order .
      - name: Start with no keys and check /healthz
        run: |
          docker run -d --name bko -p 8000:8000 bol-ke-order
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs bko
          exit 1
