services:
  bol-ke-order:
    build: .
    image: bol-ke-order:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # All optional. The app starts and works without them.
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
    volumes:
      - orders-data:/data
    restart: unless-stopped
volumes:
  orders-data:
