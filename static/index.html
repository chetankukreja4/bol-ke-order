<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Bol-ke-Order</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top no-print">
  <div class="brand" id="goHome">Bol-ke-Order <span>बोल के ऑर्डर</span></div>
  <div id="pills" class="pills"></div>
</header>

<main>
<!-- HOME -->
<section id="screen-home" class="screen active">
  <button id="micOrder" class="mic-big" aria-label="Hold and speak the order">
    <span class="mic-icon">🎤</span>
    <span class="mic-label">Order bolo</span>
    <span class="mic-hint">Hold to speak · or tap once</span>
  </button>
  <div id="liveText" class="live"></div>

  <label class="btn btn-outline upload">
    <input id="fileInput" type="file" accept=".m4a,.ogg,.oga,.opus,.mp3,.wav,.webm,.aac,audio/*" hidden>
    ⬆ Upload call recording or voice note
  </label>
  <p class="note">⚠ Recording a customer's call needs their consent. Ask them first.</p>

  <details class="card">
    <summary>Type the order instead</summary>
    <textarea id="typed" rows="3" placeholder="ABC wale ko 10 carton sabun, 5 carton tel, kal bhej dena"></textarea>
    <button id="typedGo" class="btn">Samjho →</button>
  </details>

  <details class="card">
    <summary>Try sample phrases (10)</summary>
    <div id="samples" class="chips"></div>
  </details>

  <div class="card">
    <div class="row-between"><h3>Dispatch</h3></div>
    <button id="micDispatch" class="btn btn-dark big">🎤 Dispatch bolo <small>"ABC ka maal gaya, rickshaw se"</small></button>
    <div id="dispatchBox" class="dispatch hidden"></div>
  </div>

  <div class="card">
    <div class="row-between"><h3>Recent orders</h3><a class="link" href="/api/orders.csv">CSV review sheet</a></div>
    <div id="orders" class="orders"></div>
  </div>
</section>

<!-- TRANSCRIPT -->
<section id="screen-transcript" class="screen">
  <h2>Heard text</h2>
  <div id="trStatus" class="status"></div>
  <textarea id="trText" rows="5"></textarea>
  <audio id="trAudio" controls class="hidden"></audio>
  <div class="actions">
    <button id="trRetry" class="btn btn-outline hidden">↻ Send recording again</button>
    <button id="trAgain" class="btn btn-outline">🎤 Dobara bolo</button>
    <button id="trGo" class="btn">Samjho →</button>
  </div>
</section>

<!-- CONFIRM -->
<section id="screen-confirm" class="screen">
  <div class="compare">
    <div class="col"><div class="col-h">Heard</div><div id="cfHeard" class="heard"></div></div>
    <div class="col"><div class="col-h">Understood</div><div id="cfParty" class="party"></div><div id="cfDate" class="date"></div></div>
  </div>
  <div id="cfLines" class="lines"></div>
  <div id="cfQuestion" class="question hidden"></div>
  <div id="cfSay" class="say"></div>
  <button id="micAnswer" class="mic-mid">🎤 <span>Jawab bolo</span></button>
  <div id="answerLive" class="live"></div>
  <details class="card small">
    <summary>Type answer</summary>
    <div class="row"><input id="ansTyped" placeholder="lux / nahi, aath carton / haan pakka"><button id="ansGo" class="btn">OK</button></div>
  </details>
  <div class="actions sticky">
    <button id="cfBack" class="btn btn-outline">← Back</button>
    <button id="cfConfirm" class="btn btn-confirm" disabled>✔ Haan, pakka (Confirm)</button>
  </div>
</section>

<!-- DONE -->
<section id="screen-done" class="screen">
  <div class="saved no-print">✔ Order saved</div>
  <div id="parchi" class="parchi"></div>
  <div class="actions no-print">
    <button id="dnPrint" class="btn btn-outline">🖨 Print parchi</button>
    <a id="dnCsv" class="btn btn-outline" href="#">⬇ CSV for billing</a>
    <button id="dnNew" class="btn">+ New order</button>
  </div>
</section>
</main>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
